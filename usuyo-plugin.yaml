# 微博获取插件：按一条链接取单条微博（文字、图片、视频、转发的那一条）。
# 几种方法各列一项（usuyo 协议 §2.3.1），没做的也列；行和 usuyo 仓库 docs/platforms/routes.md 第 9 节一一对应。
# status 读公开的 ajax/statuses/show（对照 yt-dlp weibo.py、ParseHub weibo.py），要一份访客身份：
# 访客身份不是账号，usuyo 开一次微博首页、不登录，存下页面自己生成的 cookie，经 USUYO_VISITOR 交过来；没交就回 visitor-required。
# 全部只在本机的假服务器上测过，没有对着真的微博跑过。
protocol: 1
id: usuyo-fetch/weibo
kind: fetch
name: 微博
description: 按链接取单条微博的文字、图片和视频，转发的那一条一并取（要一份访客身份，不是账号）
version: 0.1.0
license: MIT
maintainers: [Fldicoahkiin]
upstream:
  - name: yt-dlp（接口路径、访客跳转、播放地址的字段）
    url: https://github.com/yt-dlp/yt-dlp
    license: Unlicense
  - name: ParseHub（接口参数、图片和视频的字段）
    url: https://github.com/z-mio/ParseHub
    license: MIT
  - name: Weibo-archiver（回答里的字段名）
    url: https://github.com/Chilfish/Weibo-archiver
    license: Apache-2.0
platforms: [weibo]
match:
  - "weibo.com/*/*"
  - "www.weibo.com/*/*"
  - "weibo.com/detail/*"
  - "www.weibo.com/detail/*"
  - "m.weibo.cn/status/*"
  - "m.weibo.cn/detail/*"
visitors:
  - site: weibo.com
    name: 微博
    url: https://weibo.com/
methods:
  - id: status
    name: 公开微博页的数据接口
    access: public-web
    login: none
    account: visitor
    visitors: [weibo.com]
    risk:
      text: 访客路径只见到 IP 层的限制；微博协议 4.5.1 按频率判
      source: {label: "调研 06 §1.3", url: "https://github.com/usuyo/usuyo/blob/main/docs/research/06-platform-access-and-account-risk.md#13-混合路径视觉层拿链接公开页面取内容"}
    capabilities:
      fetch:
        outputs: [text, images, media:video, meta]
  - id: userscript
    name: 浏览器脚本（收藏、赞过）
    access: browser-session
    login: required
    account: own-browser
    delivers: links
  - id: favorites
    name: 收藏（登录进 usuyo）
    built: false
    access: session-api
    login: required
    account: in-usuyo
    capabilities:
      list:
        order: newest-first
  - id: mediacrawler
    name: MediaCrawler 的结果文件
    access: private-api
    login: none
    account: none
    risk:
      text: 文件是你自己用登录了你账号的 MediaCrawler 跑出来的；这种方法只读你交来的文件，不向任何平台发请求。记录到的封禁在 MediaCrawler 采集的那一侧（它的 issue 里有小红书账号被永久封禁的报告）
      source: {label: "MediaCrawler #865", url: "https://github.com/NanmiCoder/MediaCrawler/issues/865"}
    capabilities:
      list:
        order: unordered
        files: ["*.json", "*.jsonl", "*.zip"]
        reads: MediaCrawler 保存成 json 或 jsonl 的微博帖子文件（名字里带 contents；评论文件、CSV、SQLite 不读），或把 data 文件夹压成的 zip
pacing:
  weibo: {batch: true, interval: 10s, daily: 200}
permissions:
  fs:
    read: ["${INPUT}"]
    write: ["${OUT}"]
  network:
    mode: allowlist
    hosts:
      - "weibo.com"
      - "*.sinaimg.cn"
      - "*.weibocdn.com"
  env: []
  devices: []
  gpu: false
run:
  command: ["${PLUGIN_DIR}/usuyo-fetch-weibo"]
